{% extends "adminpanel/base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto">
    <h1 class="text-2xl font-bold text-slate-900 mb-6">{{ title }}</h1>

    <form method="post" class="bg-white rounded-xl shadow-sm p-6 space-y-4">
        {% csrf_token %}

        <div>
            <label for="name" class="block text-sm font-medium text-slate-700 mb-1">Nom *</label>
            <input type="text" name="name" id="name" required
                   value="{{ category.name|default:'' }}"
                   class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div>
            <label for="parent" class="block text-sm font-medium text-slate-700 mb-1">Catégorie parente</label>
            <select name="parent" id="parent"
                    class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <option value="">— Aucune (catégorie racine) —</option>
                {% for p in parents %}
                <option value="{{ p.pk }}" {% if category.parent_id == p.pk %}selected{% endif %}>{{ p.name }}</option>
                {% endfor %}
            </select>
            <p class="text-xs text-slate-400 mt-1">Laisser vide pour créer une catégorie racine.</p>
        </div>

        <div>
            <label for="icon" class="block text-sm font-medium text-slate-700 mb-1">Icône (emoji ou classe)</label>
            <input type="text" name="icon" id="icon"
                   value="{{ category.icon|default:'' }}"
                   class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                   placeholder="💻 ou fa-laptop">
        </div>

        <div>
            <label for="order" class="block text-sm font-medium text-slate-700 mb-1">Ordre d'affichage</label>
            <input type="number" name="order" id="order" min="0"
                   value="{{ category.order|default:'0' }}"
                   class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div class="flex items-center gap-3 pt-4">
            <button type="submit" class="px-6 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium rounded-xl transition-colors">
                {% if category %}Enregistrer{% else %}Créer{% endif %}
            </button>
            <a href="{% url 'adminpanel:category-list' %}" class="px-4 py-2 text-sm text-slate-600 hover:text-slate-800">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
