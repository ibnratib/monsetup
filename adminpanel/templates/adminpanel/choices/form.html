{% extends "adminpanel/base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <a href="{% url 'adminpanel:choice-list' attr_pk=attribute.pk %}" class="text-sm text-blue-600 hover:text-blue-800">&larr; Retour aux choix</a>
    <h1 class="text-2xl font-bold text-gray-900 mt-2 mb-6">{{ title }}</h1>

    <form method="post" class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 space-y-4">
        {% csrf_token %}

        <div>
            <label for="value" class="block text-sm font-medium text-gray-700 mb-1">Valeur *</label>
            <input type="text" name="value" id="value" required
                   value="{{ choice.value|default:'' }}"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                   placeholder="Apple, Dell, 16 Go...">
        </div>

        <div>
            <label for="order" class="block text-sm font-medium text-gray-700 mb-1">Ordre</label>
            <input type="number" name="order" id="order" min="0"
                   value="{{ choice.order|default:'0' }}"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="flex items-center gap-3 pt-4">
            <button type="submit" class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg transition-colors">
                {% if choice %}Enregistrer{% else %}Créer{% endif %}
            </button>
            <a href="{% url 'adminpanel:choice-list' attr_pk=attribute.pk %}" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
