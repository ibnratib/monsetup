{% extends "base.html" %}

{% block title %}Inscription — Setup.ma{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold text-gray-900 lg:text-3xl text-center">Créer un compte</h1>
    <p class="mt-2 text-sm text-gray-500 text-center">Choisissez votre type de compte</p>

    <div class="mt-8 grid grid-cols-1 sm:grid-cols-2 gap-6">
        <!-- Particulier -->
        <a href="{% url 'register-particulier-ssr' %}"
           class="bg-white rounded-xl shadow-sm border border-gray-200 p-8 hover:shadow-md transition-shadow text-center block">
            <div class="w-16 h-16 mx-auto bg-blue-50 rounded-full flex items-center justify-center mb-4">
                <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
            </div>
            <h2 class="text-lg font-medium text-gray-900">Particulier</h2>
            <p class="mt-2 text-sm text-gray-500">Vendez vos produits entre particuliers</p>
        </a>

        <!-- Boutique -->
        <a href="{% url 'register-boutique-ssr' %}"
           class="bg-white rounded-xl shadow-sm border border-gray-200 p-8 hover:shadow-md transition-shadow text-center block">
            <div class="w-16 h-16 mx-auto bg-blue-50 rounded-full flex items-center justify-center mb-4">
                <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                </svg>
            </div>
            <h2 class="text-lg font-medium text-gray-900">Boutique</h2>
            <p class="mt-2 text-sm text-gray-500">Créez votre vitrine professionnelle</p>
        </a>
    </div>

    <p class="mt-8 text-center text-sm text-gray-500">
        Déjà un compte ?
        <a href="{% url 'login' %}" class="text-blue-600 hover:text-blue-700 hover:underline">Se connecter</a>
    </p>
</div>
{% endblock %}
